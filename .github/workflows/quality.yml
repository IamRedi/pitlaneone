name: Quality gate
# Routine development verification runs directly on laptop/mini PC.
# Explicit cloud verification only; all jobs and required assertions remain.
# See LOCAL_CI_POLICY.md. Operational workflows have separate contracts.
on:
  workflow_dispatch:

permissions:
  contents: read
jobs:
  application:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Publication boundary
        run: python3 tools/check_public_export.py
      - run: npm ci
        working-directory: frontend
      - name: Lint and TypeScript
        working-directory: frontend
        run: |
          npm run lint
          npm run typecheck
      - name: Deterministic checks
        working-directory: frontend
        run: |
          npm run test:i18n
          npm run test:business-site-engine
          npm run test:billing-grants
          npm run test:xrechnung
          npm run test:auth-redirect
          npm run test:invitation-error
          npm run test:validation
      - name: Build
        working-directory: frontend
        run: npm run build
  dependency-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
